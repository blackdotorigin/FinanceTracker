spring.application.name=Tracker

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/financeTracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cookie-secure=${COOKIE_SECURE:false}
app.security.permit-all-api=${PERMIT_ALL_API:false}
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=blackdot-finance
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=30d

server.forward-headers-strategy=framework

# OAuth credentials should be provided by the deployment environment.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
