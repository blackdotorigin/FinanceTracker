spring.application.name=Tracker
spring.datasource.url=${DB_URL:jdbc:h2:mem:financetracker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
app.bootstrap-user.email=${BOOTSTRAP_USER_EMAIL:sample@gmail.com}
app.bootstrap-user.username=${BOOTSTRAP_USER_USERNAME:sample}
app.bootstrap-user.password=${BOOTSTRAP_USER_PASSWORD:admin@123}
app.bootstrap-user.full-name=${BOOTSTRAP_USER_FULL_NAME:Sample User}

app.frontend-url=${FRONTEND_URL:http://localhost:8080}
app.cookie-secure=${COOKIE_SECURE:false}
# Development fallback only; production deployments must provide JWT_SECRET.
app.jwt.secret=${JWT_SECRET:local-only-jwt-secret-do-not-use-in-production-0123456789abcdef}
app.jwt.issuer=blackdot-finance
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=30d
server.forward-headers-strategy=framework


# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Github
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,user:email


Database
spring.datasource.url=jdbc:postgresql://192.168.68.109:5432/financeTracker
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true


spring.profiles.active=dev